name: Test Git-Copy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # SYNTAX VALIDATION - Check script code quality
  # ------------------------------------------------------------------
  syntax-check:
    name: Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Bash Scripts Syntax
        run: |
          echo "=== Checking Bash Script Syntax ==="
          for script in install.sh test.sh; do
            echo "Checking $script..."
            bash -n "$script" || exit 1
            echo "[OK] $script syntax OK"
          done

      - name: PowerShell Syntax Check
        run: |
          echo "=== Checking PowerShell Script Syntax ==="
          pwsh -Command "
            \$scripts = @('git-copy.ps1', 'test.ps1', 'install.ps1')
            foreach (\$script in \$scripts) {
              Write-Host \"Checking \$script...\"
              \$errors = \$null
              \$null = [System.Management.Automation.PSParser]::Tokenize((Get-Content \$script -Raw), [ref]\$errors)
              if (\$errors.Count -gt 0) {
                Write-Error \"Syntax errors in \$script\"
                exit 1
              }
              Write-Host \"[OK] \$script syntax OK\"
            }
          "

  # ------------------------------------------------------------------
  # TEST WINDOWS (PowerShell Version)
  # ------------------------------------------------------------------
  test-windows:
    name: Windows (PowerShell)
    runs-on: windows-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4

      - name: Run Test Suite
        shell: powershell
        run: |
          Write-Host "=== Running Windows Test Suite ===" -ForegroundColor Cyan
          .\test.ps1

      - name: Integration Test - Direct Script Execution
        shell: powershell
        run: |
          # ==========================================================================
          # LAYER A: Pure Data Structure (The Contract)
          # ==========================================================================
          class TestScenario {
              [string] $Name
              [string] $Arguments
              [hashtable] $FileSystemState
              [string[]] $MustContain
              [string[]] $MustNotContain
          }

          # ==========================================================================
          # LAYER B: High-Performance Test Engine
          # ==========================================================================
          function Invoke-GitCopyTest {
              param(
                  [Parameter(Mandatory)]
                  [string]$ToolPath,

                  [Parameter(Mandatory)]
                  [TestScenario[]]$Scenarios
              )

              $ErrorActionPreference = "Stop"

              # 1. GLOBAL SETUP
              $SandboxRoot = Join-Path ([System.IO.Path]::GetTempPath()) "GitCopy_Test_Sandbox_$(Get-Random)"

              try {
                  foreach ($Case in $Scenarios) {
                      Write-Host "[:] SCENARIO: $($Case.Name)" -ForegroundColor Cyan

                      # ---------------------------------------------------------
                      # PHASE 1: SANDBOX CONSTRUCTION
                      # ---------------------------------------------------------
                      if (Test-Path $SandboxRoot) { Remove-Item $SandboxRoot -Recurse -Force | Out-Null }
                      $null = New-Item -ItemType Directory -Path $SandboxRoot

                      foreach ($Key in $Case.FileSystemState.Keys) {
                          $FullPath = Join-Path $SandboxRoot $Key
                          $ParentDir = Split-Path $FullPath
                          if (-not (Test-Path $ParentDir)) { $null = New-Item -ItemType Directory -Path $ParentDir }

                          $Case.FileSystemState[$Key] | Set-Content -Path $FullPath
                      }

                      # ---------------------------------------------------------
                      # PHASE 2: IN-MEMORY MOCKING
                      # ---------------------------------------------------------
                      $ScriptBlock = {
                          param($ToolPath, $Args, $SandboxRoot)

                          # THE TRAP: In-memory variable
                          $global:MockClipboardRam = $null

                          # THE MOCK: Pipeline-aware aggregation
                          function Set-Clipboard {
                              param([Parameter(ValueFromPipeline)]$InputObject)

                              Begin { $InternalBuffer = [System.Collections.Generic.List[string]]::new() }
                              Process {
                                  if ($null -ne $_) { $InternalBuffer.Add($_) }
                              }
                              End {
                                  $global:MockClipboardRam = $InternalBuffer -join [Environment]::NewLine
                              }
                          }

                          # EXECUTE
                          Push-Location $SandboxRoot
                          try {
                              & $ToolPath $Args
                          }
                          finally {
                              Pop-Location
                          }
                      }

                      # ---------------------------------------------------------
                      # PHASE 3: EXECUTION & ASSERTION
                      # ---------------------------------------------------------
                      Invoke-Command -ScriptBlock $ScriptBlock -ArgumentList $ToolPath, $Case.Arguments, $SandboxRoot

                      # Retrieve the trap variable
                      $ResultData = $global:MockClipboardRam

                      # Validation: Null Check
                      if ([string]::IsNullOrWhiteSpace($ResultData)) {
                          throw "[-] CRITICAL FAIL: Clipboard was empty. Tool produced no output."
                      }

                      # Validation: Whitelist
                      foreach ($Term in $Case.MustContain) {
                          if ($ResultData -notmatch [regex]::Escape($Term)) {
                              throw "[-] FAIL: Output missing required term '$Term'"
                          }
                      }

                      # Validation: Blacklist
                      foreach ($Term in $Case.MustNotContain) {
                          if ($ResultData -match [regex]::Escape($Term)) {
                              throw "[-] FAIL: Output contains forbidden term '$Term'"
                          }
                      }

                      Write-Host "    [+] PASS" -ForegroundColor Green
                  }
              }
              catch {
                  Write-Error "TEST FAILURE IN SCENARIO [$($Case.Name)]: $_"
                  exit 1
              }
              finally {
                  if (Test-Path $SandboxRoot) { Remove-Item $SandboxRoot -Recurse -Force | Out-Null }
                  $global:MockClipboardRam = $null
              }
          }

          # ==========================================================================
          # LAYER C: The Runner (Configuration)
          # ==========================================================================
          & {
              # --- DATA DEFINITION ---
              $Tests = @(
                  [TestScenario]@{
                      Name            = "Unity Project Export Test"
                      Arguments       = "unity"
                      FileSystemState = @{
                          "Player.cs"          = "public class Player : MonoBehaviour {}"
                          "Player.cs.meta"     = "guid: xyz"
                          "Library/Cache.bin"  = "010101"
                          ".env"               = "AWS_KEY=SECRET"
                      }
                      MustContain     = @("Player.cs", "public class Player")
                      MustNotContain  = @("Player.cs.meta", "Library", ".env")
                  }
              )

              # --- EXECUTION CONTEXT RESOLVER ---
              # Detect if running in CI (GitHub Actions) or locally
              if ($env:GITHUB_ACTIONS -eq 'true') {
                  # CI MODE: Code is in Workspace root
                  $BaseDir = $env:GITHUB_WORKSPACE
                  Write-Host "[INFO] Detected CI Environment. Root: $BaseDir" -ForegroundColor Cyan
              }
              else {
                  # LOCAL MODE: Code is relative to test script
                  $BaseDir = $PSScriptRoot
                  Write-Host "[INFO] Detected Local Environment. Root: $BaseDir" -ForegroundColor Cyan
              }

              $ToolLocation = Join-Path $BaseDir "git-copy.ps1"

              # --- PRE-FLIGHT CHECK ---
              if (-not (Test-Path $ToolLocation)) {
                  # List directory contents for debugging
                  Write-Warning "BaseDir Contents:"
                  Get-ChildItem $BaseDir | Select-Object Name | Format-Table -HideTableHeaders
                  throw "CRITICAL: Tool not found at [$ToolLocation]"
              }

              Invoke-GitCopyTest -ToolPath $ToolLocation -Scenarios $Tests

              Write-Host "`n[SUCCESS] All Integration Tests Passed." -ForegroundColor Green
          }

      - name: Create Report
        if: always()
        run: |
          echo "## Win Windows Test Report" >> $env:GITHUB_STEP_SUMMARY
          echo "[PASS] Syntax Validation: Passed" >> $env:GITHUB_STEP_SUMMARY
          echo "[PASS] Test Suite: Executed" >> $env:GITHUB_STEP_SUMMARY
          echo "[PASS] Integration Tests: Passed" >> $env:GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------------
  # TEST UNIX (Bash Version - Mac & Linux)
  # ------------------------------------------------------------------
  test-unix:
    name: ${{ matrix.os }} (Bash)
    runs-on: ${{ matrix.os }}
    needs: syntax-check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Run Test Suite
        run: |
          echo "=== Running Unix Test Suite ==="
          ./test.sh

      - name: Integration Test - Installed Tool
        run: |
          # ==========================================================================
          # LAYER A: Test Scenario Data Structure
          # ==========================================================================
          # In Bash, we use functions to define scenario data
          define_scenario() {
              SCENARIO_NAME="$1"
              SCENARIO_ARGS="$2"
              SCENARIO_MUST_CONTAIN="$3"
              SCENARIO_MUST_NOT_CONTAIN="$4"
          }

          # ==========================================================================
          # LAYER B: Reusable Test Engine
          # ==========================================================================
          run_git_copy_test() {
              local scenario_name="$1"
              local scenario_args="$2"
              local must_contain="$3"
              local must_not_contain="$4"
              shift 4

              # Create sandbox
              local sandbox_root=$(mktemp -d)
              trap "rm -rf '$sandbox_root'" EXIT

              echo "[:] SCENARIO: $scenario_name"

              # ---------------------------------------------------------
              # PHASE 1: Sandbox Construction
              # ---------------------------------------------------------
              # Process remaining args as file_spec=content pairs
              while [[ $# -gt 0 ]]; do
                  local file_spec="$1"
                  local content="$2"
                  shift 2

                  local full_path="$sandbox_root/$file_spec"
                  mkdir -p "$(dirname "$full_path")"
                  echo "$content" > "$full_path"
              done

              # ---------------------------------------------------------
              # PHASE 2: Mock Clipboard Setup
              # ---------------------------------------------------------
              local mock_output="$sandbox_root/mock_clipboard.txt"
              mkdir -p "$sandbox_root/bin"

              for cmd in pbcopy xclip wl-copy; do
                  printf '#!/bin/bash\ncat > "$SANDBOX_ROOT/mock_clipboard.txt"\n' > "$sandbox_root/bin/$cmd"
                  chmod +x "$sandbox_root/bin/$cmd"
              done

              # ---------------------------------------------------------
              # PHASE 3: Execution
              # ---------------------------------------------------------
              (
                  cd "$sandbox_root"
                  SANDBOX_ROOT="$sandbox_root" \
                  PATH="$sandbox_root/bin:$PATH" \
                  /usr/local/bin/git-copy $scenario_args &>/dev/null || true
              )

              # ---------------------------------------------------------
              # PHASE 4: Validation
              # ---------------------------------------------------------
              if [[ ! -f "$mock_output" ]]; then
                  echo "    [-] FAIL: No output created"
                  exit 1
              fi

              local result_data
              result_data=$(cat "$mock_output")

              # Null Check
              if [[ -z "$result_data" ]]; then
                  echo "    [-] FAIL: Clipboard was empty"
                  exit 1
              fi

              # Whitelist Validation
              local term
              for term in $(echo "$must_contain" | tr ',' ' '); do
                  if ! echo "$result_data" | grep -qF "$term"; then
                      echo "    [-] FAIL: Output missing required term '$term'"
                      exit 1
                  fi
              done

              # Blacklist Validation
              for term in $(echo "$must_not_contain" | tr ',' ' '); do
                  if echo "$result_data" | grep -qF "$term"; then
                      echo "    [-] FAIL: Output contains forbidden term '$term'"
                      exit 1
                  fi
              done

              echo "    [+] PASS"
          }

          # ==========================================================================
          # LAYER C: Test Configuration & Execution
          # ==========================================================================
          {
              # --- EXECUTION CONTEXT RESOLVER ---
              # Detect if running in CI (GitHub Actions) or locally
              if [[ "${GITHUB_ACTIONS:-}" == "true" ]]; then
                  # CI MODE: Code is in Workspace root
                  BASE_DIR="${GITHUB_WORKSPACE}"
                  echo "[INFO] Detected CI Environment. Root: ${BASE_DIR}"
              else
                  # LOCAL MODE: Code is in current directory
                  BASE_DIR="$(pwd)"
                  echo "[INFO] Detected Local Environment. Root: ${BASE_DIR}"
              fi

              # --- INSTALLATION ---
              cd "$BASE_DIR"
              chmod +x install.sh
              sudo ./install.sh

              # --- PRE-FLIGHT CHECK ---
              if [[ ! -f "/usr/local/bin/git-copy" ]]; then
                  echo "[WARN] Installed tool not found. Listing contents:" >&2
                  ls -la /usr/local/bin/ | grep git || echo "No git-* tools found in /usr/local/bin/" >&2
                  exit 1
              fi

              # --- TEST EXECUTION ---
              # SCENARIO: Unity Project Export Test
              run_git_copy_test \
                  "Unity Project Export Test" \
                  "unity" \
                  "Player.cs,public class Player" \
                  "Player.cs.meta,Library,.env" \
                  "Player.cs" "public class Player : MonoBehaviour {}" \
                  "Player.cs.meta" "guid: xyz" \
                  "Library/Cache.bin" "010101" \
                  ".env" "AWS_KEY=SECRET"

              echo ""
              echo "[SUCCESS] All Integration Tests Passed."
          }

      - name: Create Report
        if: always()
        run: |
          OS_ICON="Linux"
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then OS_ICON="macOS"; fi

          echo "## $OS_ICON ${{ matrix.os }} Test Report" >> $GITHUB_STEP_SUMMARY
          echo "[PASS] Syntax Validation: Passed" >> $GITHUB_STEP_SUMMARY
          echo "[PASS] Test Suite: Executed" >> $GITHUB_STEP_SUMMARY
          echo "[PASS] Integration Tests: Passed" >> $GITHUB_STEP_SUMMARY
