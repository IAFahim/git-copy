name: Test Git-Copy (Unity Edition)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # TEST WINDOWS (PowerShell Version)
  # ------------------------------------------------------------------
  test-windows:
    name: Windows (PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Test Fixtures (Unity Style)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "TestProject"
          # Main files
          "public class PlayerController : MonoBehaviour {}" | Set-Content "TestProject/Player.cs"
          "guid: 12345" | Set-Content "TestProject/Player.cs.meta"
          "SECRET_KEY=123" | Set-Content "TestProject/.env"
          "node_modules stuff" | Set-Content "TestProject/package-lock.json"

          # Pattern exclusion test fixtures
          New-Item -ItemType Directory -Force -Path "TestProject/MyApp.Tests"
          "public class TestClass {}" | Set-Content "TestProject/MyApp.Tests/UnitTest.cs"
          "public class UtilsTest {}" | Set-Content "TestProject/Utils.Tests.cs"
          "# Test File" | Set-Content "TestProject/README.md"
          New-Item -ItemType Directory -Force -Path "TestProject/docs"
          "# Docs" | Set-Content "TestProject/docs/guide.md"
          "test content" | Set-Content "TestProject/test_file.cs"

      - name: Run Tool & Verify
        shell: powershell
        run: |
          # 1. Mock Set-Clipboard to capture output to a file instead of system clipboard
          function Set-Clipboard {
              param([Parameter(ValueFromPipeline=$true)]$Value)
              $Value | Set-Content "clipboard_output.md"
          }

          # 2. Run the LOCAL script against TestProject
          cd TestProject
          & ..\git-copy.ps1

          # 3. Read Output
          if (Test-Path "clipboard_output.md") {
             $Output = Get-Content "clipboard_output.md" -Raw
          } else {
             Write-Error "FAIL: Output file not created."
             exit 1
          }

          Write-Host "--- CAPTURED OUTPUT ---"
          Write-Host $Output
          Write-Host "-----------------------"

          # 4. Assertions
          $TestPassed = $true
          
          # Check if Unity C# file is present
          if ($Output -notmatch "Player.cs") { 
            Write-Error "FAIL: Player.cs missing from output."
            $TestPassed = $false 
          }
          
          # Check if .meta file is IGNORED
          if ($Output -match "Player.cs.meta") { 
            Write-Error "FAIL: .meta file was NOT ignored."
            $TestPassed = $false 
          }

          # Check if .env is IGNORED
          if ($Output -match "SECRET_KEY") { 
            Write-Error "FAIL: Secrets (.env) were leaking."
            $TestPassed = $false 
          }

          if ($TestPassed) {
            Write-Host "[PASS] Windows Tests Passed" -ForegroundColor Green
          } else {
            exit 1
          }

      - name: Test Pattern Exclusion Feature
        shell: powershell
        run: |
          # Test 1: --*.Tests pattern
          Write-Host "Testing pattern: --*.Tests"
          function Set-Clipboard {
              param([Parameter(ValueFromPipeline=$true)]$Value)
              $Value | Set-Content "clipboard_pattern1.md"
          }
          cd TestProject
          & ..\git-copy.ps1 --*.Tests

          $Output1 = Get-Content "clipboard_pattern1.md" -Raw

          # Should NOT contain .Tests files/folders
          if ($Output1 -match "MyApp.Tests" -or $Output1 -match "Utils.Tests.cs") {
            Write-Error "FAIL: Pattern --*.Tests did not exclude test files."
            exit 1
          }
          # Should still contain normal files
          if ($Output1 -notmatch "Player.cs") {
            Write-Error "FAIL: Pattern --*.Tests excluded normal files."
            exit 1
          }
          Write-Host "PASS: --*.Tests pattern works correctly" -ForegroundColor Green

          # Test 2: -.md extension exclusion
          Write-Host "Testing pattern: -.md"
          function Set-Clipboard {
              param([Parameter(ValueFromPipeline=$true)]$Value)
              $Value | Set-Content "clipboard_pattern2.md"
          }
          & ..\git-copy.ps1 -.md

          $Output2 = Get-Content "clipboard_pattern2.md" -Raw

          # Should NOT contain .md files
          if ($Output2 -match "README.md" -or $Output2 -match "guide.md") {
            Write-Error "FAIL: Pattern -.md did not exclude markdown files."
            exit 1
          }
          Write-Host "PASS: -.md pattern works correctly" -ForegroundColor Green

          # Test 3: Multiple patterns --*.Tests -.md
          Write-Host "Testing multiple patterns: --*.Tests -.md"
          function Set-Clipboard {
              param([Parameter(ValueFromPipeline=$true)]$Value)
              $Value | Set-Content "clipboard_pattern3.md"
          }
          & ..\git-copy.ps1 --*.Tests -.md

          $Output3 = Get-Content "clipboard_pattern3.md" -Raw

          # Should NOT contain .Tests OR .md files
          if ($Output3 -match "MyApp.Tests" -or $Output3 -match "Utils.Tests.cs" -or $Output3 -match "README.md") {
            Write-Error "FAIL: Multiple patterns did not work correctly."
            exit 1
          }
          Write-Host "PASS: Multiple patterns work correctly" -ForegroundColor Green

          Write-Host "[PASS] All Pattern Exclusion Tests Passed" -ForegroundColor Green

      - name: Create Report
        if: always()
        run: |
          echo "## 🪟 Windows Test Report" >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path "TestProject/clipboard_output.md") {
             echo "✅ Execution Successful" >> $env:GITHUB_STEP_SUMMARY
          } else {
             echo "❌ Execution Failed" >> $env:GITHUB_STEP_SUMMARY
          }

  # ------------------------------------------------------------------
  # TEST UNIX (Bash Version - Mac & Linux)
  # ------------------------------------------------------------------
  test-unix:
    name: ${{ matrix.os }} (Bash)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Test Fixtures (Unity Style)
        run: |
          mkdir TestProject
          cd TestProject
          # Main files
          echo "public class PlayerController : MonoBehaviour {}" > Player.cs
          echo "guid: 12345" > Player.cs.meta
          echo "SECRET_KEY=123" > .env
          echo "garbage" > package-lock.json

          # Pattern exclusion test fixtures
          mkdir -p MyApp.Tests
          echo "public class TestClass {}" > MyApp.Tests/UnitTest.cs
          echo "public class UtilsTest {}" > Utils.Tests.cs
          echo "# Test File" > README.md
          mkdir -p docs
          echo "# Docs" > docs/guide.md
          echo "test content" > test_file.cs

          # Initialize git to test git-aware features
          git init
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          git add .

      - name: Install & Mock Clipboard
        run: |
          # The bash script installs to /usr/local/bin/git-copy
          # We run the installer script first
          chmod +x install.sh
          sudo ./install.sh

          # MOCK CLIPBOARD TOOLS
          mkdir -p $HOME/bin
          
          # Mock pbcopy (Mac)
          echo '#!/bin/bash' > $HOME/bin/pbcopy
          echo 'cat > $HOME/mock_clipboard.txt' >> $HOME/bin/pbcopy
          chmod +x $HOME/bin/pbcopy
          
          # Mock xclip (Linux)
          echo '#!/bin/bash' > $HOME/bin/xclip
          echo 'cat > $HOME/mock_clipboard.txt' >> $HOME/bin/xclip
          chmod +x $HOME/bin/xclip

          # Mock wl-copy (Wayland Linux)
          echo '#!/bin/bash' > $HOME/bin/wl-copy
          echo 'cat > $HOME/mock_clipboard.txt' >> $HOME/bin/wl-copy
          chmod +x $HOME/bin/wl-copy

      - name: Run Tool & Verify
        run: |
          # Add mocks to path
          export PATH="$HOME/bin:$PATH"
          
          cd TestProject
          
          # Run the installed tool
          /usr/local/bin/git-copy unity

          echo "--- CHECKING OUTPUT ---"
          if [ ! -f "$HOME/mock_clipboard.txt" ]; then
            echo "❌ Fatal: No output sent to clipboard mock."
            exit 1
          fi
          
          OUTPUT=$(cat $HOME/mock_clipboard.txt)
          echo "$OUTPUT"

          # Assertions
          FAILED=0
          
          if echo "$OUTPUT" | grep -q "Player.cs"; then
            echo "✅ Found Player.cs"
          else
            echo "❌ Missing Player.cs"
            FAILED=1
          fi

          if echo "$OUTPUT" | grep -q "Player.cs.meta"; then
            echo "❌ Failed to ignore .meta file"
            FAILED=1
          else
            echo "✅ Correctly ignored .meta file"
          fi

          if echo "$OUTPUT" | grep -q "SECRET_KEY"; then
            echo "❌ Failed to ignore .env file"
            FAILED=1
          else
            echo "✅ Correctly ignored .env file"
          fi

          if [ $FAILED -eq 1 ]; then exit 1; fi

      - name: Test Pattern Exclusion Feature
        run: |
          # Add mocks to path
          export PATH="$HOME/bin:$PATH"

          cd TestProject

          # Test 1: --*.Tests pattern
          echo "Testing pattern: --*.Tests"
          /usr/local/bin/git-copy --*.Tests

          OUTPUT1=$(cat $HOME/mock_clipboard.txt)

          # Should NOT contain .Tests files/folders
          if echo "$OUTPUT1" | grep -q "MyApp.Tests\|Utils.Tests.cs"; then
            echo "❌ FAIL: Pattern --*.Tests did not exclude test files."
            exit 1
          fi
          # Should still contain normal files
          if ! echo "$OUTPUT1" | grep -q "Player.cs"; then
            echo "❌ FAIL: Pattern --*.Tests excluded normal files."
            exit 1
          fi
          echo "✅ PASS: --*.Tests pattern works correctly"

          # Test 2: -.md extension exclusion
          echo "Testing pattern: -.md"
          /usr/local/bin/git-copy -.md

          OUTPUT2=$(cat $HOME/mock_clipboard.txt)

          # Should NOT contain .md files
          if echo "$OUTPUT2" | grep -q "README.md\|guide.md"; then
            echo "❌ FAIL: Pattern -.md did not exclude markdown files."
            exit 1
          fi
          echo "✅ PASS: -.md pattern works correctly"

          # Test 3: Multiple patterns --*.Tests -.md
          echo "Testing multiple patterns: --*.Tests -.md"
          /usr/local/bin/git-copy --*.Tests -.md

          OUTPUT3=$(cat $HOME/mock_clipboard.txt)

          # Should NOT contain .Tests OR .md files
          if echo "$OUTPUT3" | grep -q "MyApp.Tests\|Utils.Tests.cs\|README.md"; then
            echo "❌ FAIL: Multiple patterns did not work correctly."
            exit 1
          fi
          echo "✅ PASS: Multiple patterns work correctly"

          echo "✅ [PASS] All Pattern Exclusion Tests Passed"

      - name: Create Report
        if: always()
        run: |
          OS_ICON="🐧"
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then OS_ICON="🍎"; fi
          
          echo "## $OS_ICON ${{ matrix.os }} Test Report" >> $GITHUB_STEP_SUMMARY
          if [ -f "$HOME/mock_clipboard.txt" ]; then
             echo "✅ Clipboard Capture Successful" >> $GITHUB_STEP_SUMMARY
             echo "<details><summary>View Output Snippet</summary>" >> $GITHUB_STEP_SUMMARY
             echo "" >> $GITHUB_STEP_SUMMARY
             echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
             head -n 10 $HOME/mock_clipboard.txt >> $GITHUB_STEP_SUMMARY
             echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
             echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
             echo "❌ Execution Failed" >> $GITHUB_STEP_SUMMARY
          fi