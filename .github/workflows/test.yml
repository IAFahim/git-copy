name: Test Git-Copy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # SYNTAX VALIDATION - Check script code quality
  # ------------------------------------------------------------------
  syntax-check:
    name: Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Bash Scripts Syntax
        run: |
          echo "=== Checking Bash Script Syntax ==="
          for script in install.sh test.sh; do
            echo "Checking $script..."
            bash -n "$script" || exit 1
            echo "[OK] $script syntax OK"
          done

      - name: PowerShell Syntax Check
        run: |
          echo "=== Checking PowerShell Script Syntax ==="
          pwsh -Command "
            \$scripts = @('git-copy.ps1', 'test.ps1', 'install.ps1')
            foreach (\$script in \$scripts) {
              Write-Host \"Checking \$script...\"
              \$errors = \$null
              \$null = [System.Management.Automation.PSParser]::Tokenize((Get-Content \$script -Raw), [ref]\$errors)
              if (\$errors.Count -gt 0) {
                Write-Error \"Syntax errors in \$script\"
                exit 1
              }
              Write-Host \"[OK] \$script syntax OK\"
            }
          "

  # ------------------------------------------------------------------
  # TEST WINDOWS (PowerShell Version)
  # ------------------------------------------------------------------
  test-windows:
    name: Windows (PowerShell)
    runs-on: windows-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4

      - name: Run Test Suite
        shell: powershell
        run: |
          Write-Host "=== Running Windows Test Suite ===" -ForegroundColor Cyan
          .\test.ps1

      - name: Integration Test - Direct Script Execution
        shell: powershell
        run: |
          # ==========================================================================
          # LAYER 1: The Test Engine (Generic & Reusable)
          # ==========================================================================
          & {
              $ErrorActionPreference = "Stop"

              # --- DOMAIN SPECIFIC LANGUAGE (DSL) ---

              function Assert-TextPresent {
                  param([string]$Content, [string]$Term, [string]$Context)
                  if ($Content -notmatch [regex]::Escape($Term)) {
                      throw "[-] FAIL ($Context): Output missing required term '$Term'"
                  }
              }

              function Assert-TextAbsent {
                  param([string]$Content, [string]$Term, [string]$Context)
                  if ($Content -match [regex]::Escape($Term)) {
                      throw "[-] FAIL ($Context): Output contains forbidden term '$Term'"
                  }
              }

              # --- SETUP: PATHS & CONSTANTS ---
              $Root          = Get-Location
              $ToolName      = "git-copy.ps1"
              $ToolPath      = Join-Path $Root $ToolName
              $SandboxName   = "Test_Sandbox_Area"
              $SandboxPath   = Join-Path $Root $SandboxName
              $MockOutput    = "mock_clipboard.txt"

              Write-Host "[INIT] Test Suite for: $ToolName" -ForegroundColor Cyan

              # --- LAYER 2: DATA SETUP (The Scenario) ---
              $TestScenario = @{
                  FilesToCreate = @(
                      @{ Path = "Player.cs"; Content = "public class Player : MonoBehaviour {}" }
                      @{ Path = "Player.cs.meta"; Content = "guid: xyz" }
                      @{ Path = ".env"; Content = "AWS_KEY=SECRET" }
                      @{ Path = "Library/Cache.bin"; Content = "010101" }
                  )
                  Args = "unity"
                  Expectations = @{
                      ShouldContain = @("Player.cs", "public class Player")
                      ShouldIgnore  = @("Player.cs.meta", ".env", "Library")
                  }
              }

              # --- EXECUTION ---
              try {
                  # 1. PRE-FLIGHT CHECKS
                  if (-not (Test-Path $ToolPath)) { throw "CRITICAL: Tool not found at $ToolPath" }

                  # 2. ENVIRONMENT SANITIZATION
                  if (Test-Path $SandboxPath) { Remove-Item $SandboxPath -Recurse -Force }
                  $null = New-Item -ItemType Directory -Path $SandboxPath

                  # 3. FIXTURE GENERATION
                  foreach ($File in $TestScenario.FilesToCreate) {
                      $FullPath = Join-Path $SandboxPath $File.Path
                      $ParentDir = Split-Path $FullPath
                      if (-not (Test-Path $ParentDir)) { $null = New-Item -ItemType Directory -Path $ParentDir }

                      $File.Content | Set-Content $FullPath
                  }

                  # 4. MOCK INJECTION (Corrected Pipeline Handling)
                  function Set-Clipboard {
                      param([Parameter(ValueFromPipeline=$true)]$Value)

                      End {
                          $Input | Out-String | Set-Content $MockOutput
                      }
                  }

                  # 5. ISOLATED RUN
                  Push-Location $SandboxPath
                  try {
                      Write-Host "[RUN] Executing tool with args: $($TestScenario.Args)..." -ForegroundColor Yellow

                      & $ToolPath $TestScenario.Args

                      # 6. VERIFICATION
                      if (-not (Test-Path $MockOutput)) {
                          throw "CRITICAL: Tool produced no output (Mock file missing)"
                      }

                      $Result = Get-Content $MockOutput -Raw

                      # Validate Whitelist
                      foreach ($Term in $TestScenario.Expectations.ShouldContain) {
                          Assert-TextPresent -Content $Result -Term $Term -Context "Whitelist"
                      }
                      Write-Host "[+] PASS: Core content present." -ForegroundColor Gray

                      # Validate Blacklist
                      foreach ($Term in $TestScenario.Expectations.ShouldIgnore) {
                          Assert-TextAbsent -Content $Result -Term $Term -Context "Blacklist"
                      }
                      Write-Host "[+] PASS: Ignored files are absent." -ForegroundColor Gray

                      Write-Host "`n[SUCCESS] Integration Test Passed." -ForegroundColor Green
                  }
                  finally {
                      Pop-Location
                  }
              }
              catch {
                  Write-Error $_
                  exit 1
              }
          }

      - name: Create Report
        if: always()
        run: |
          echo "## Win Windows Test Report" >> $env:GITHUB_STEP_SUMMARY
          echo "[PASS] Syntax Validation: Passed" >> $env:GITHUB_STEP_SUMMARY
          echo "[PASS] Test Suite: Executed" >> $env:GITHUB_STEP_SUMMARY
          echo "[PASS] Integration Tests: Passed" >> $env:GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------------
  # TEST UNIX (Bash Version - Mac & Linux)
  # ------------------------------------------------------------------
  test-unix:
    name: ${{ matrix.os }} (Bash)
    runs-on: ${{ matrix.os }}
    needs: syntax-check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Run Test Suite
        run: |
          echo "=== Running Unix Test Suite ==="
          ./test.sh

      - name: Integration Test - Installed Tool
        run: |
          # Install the tool
          chmod +x install.sh
          sudo ./install.sh

          # Setup test fixtures
          mkdir TestProject
          cd TestProject
          echo "public class PlayerController : MonoBehaviour {}" > Player.cs
          echo "guid: 12345" > Player.cs.meta
          echo "SECRET_KEY=123" > .env
          echo "garbage" > package-lock.json

          # Mock clipboard tools
          mkdir -p $HOME/bin
          for cmd in pbcopy xclip wl-copy; do
            echo '#!/bin/bash' > $HOME/bin/$cmd
            echo 'cat > $HOME/mock_clipboard.txt' >> $HOME/bin/$cmd
            chmod +x $HOME/bin/$cmd
          done
          export PATH="$HOME/bin:$PATH"

          # Run installed tool
          /usr/local/bin/git-copy unity

          # Verify output
          if [ ! -f "$HOME/mock_clipboard.txt" ]; then
            echo "[FAIL] FAIL: No output created"
            exit 1
          fi

          OUTPUT=$(cat $HOME/mock_clipboard.txt)

          # Assertions
          if ! echo "$OUTPUT" | grep -q "Player.cs"; then
            echo "[FAIL] FAIL: Player.cs missing"
            exit 1
          fi

          if echo "$OUTPUT" | grep -q "Player.cs.meta"; then
            echo "[FAIL] FAIL: .meta file not ignored"
            exit 1
          fi

          if echo "$OUTPUT" | grep -q "SECRET_KEY"; then
            echo "[FAIL] FAIL: .env file not ignored"
            exit 1
          fi

          echo "[OK] Integration test passed"

      - name: Create Report
        if: always()
        run: |
          OS_ICON="Linux"
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then OS_ICON="macOS"; fi

          echo "## $OS_ICON ${{ matrix.os }} Test Report" >> $GITHUB_STEP_SUMMARY
          echo "[PASS] Syntax Validation: Passed" >> $GITHUB_STEP_SUMMARY
          echo "[PASS] Test Suite: Executed" >> $GITHUB_STEP_SUMMARY
          echo "[PASS] Integration Tests: Passed" >> $GITHUB_STEP_SUMMARY
